<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nina!</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff758f; 
            --dark-pink: #c9184a;   
            --glass: rgba(255, 255, 255, 0.15); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
            background-color: #fff0f3; 
        }

        /* --- BACKGROUND TETAP ADA & BISA DIBLUR --- */
        .bg-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(255, 117, 143, 0.5), rgba(201, 24, 74, 0.6)), 
                        url('fotobg.jpg'); 
            background-size: cover;
            background-position: center;
            z-index: -2; 
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            z-index: -1;
            transition: all 0.6s ease;
            pointer-events: none; 
        }

        body.gallery-open .bg-overlay {
            background: rgba(255, 240, 243, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* --- HALAMAN UTAMA --- */
        .hero {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            animation: floatUp 15s linear infinite;
            bottom: -10%;
        }

        .heart::before { content: '❤'; }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(45deg); opacity: 0; }
        }

        /* Kartu Pesan Kaca */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 35px;
            padding: clamp(30px, 5vw, 50px) clamp(20px, 5vw, 40px);
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 500px;
            z-index: 10;
            animation: fadeIn 2s ease-out, floatCard 5s ease-in-out infinite;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.5s ease;
        }

        .glass-card.hidden {
            transform: scale(0.4) translateY(60px);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(3.5rem, 8vw, 5rem);
            color: #fff;
            text-shadow: 3px 3px 0px var(--primary-pink), 0 0 25px rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        h2 {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #fff;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .message {
            margin-top: 20px;
            color: #fff;
            font-weight: 600;
            line-height: 1.6;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .signature {
            margin-top: 30px;
            font-weight: 700;
            color: var(--dark-pink);
            background: #fff;
            display: inline-block;
            padding: 12px 35px;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-size: clamp(1rem, 2.5vw, 1.1rem);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        .signature:hover {
            transform: scale(1.05);
            background: var(--dark-pink);
            color: #fff;
        }

        /* --- GALERI FOTO --- */
        .photo-gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; 
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: clamp(60px, 10vh, 100px) 20px 60px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .photo-gallery.active {
            opacity: 1;
            pointer-events: auto;
        }

        .romantic-text {
            text-align: center;
            color: #fff; 
            margin-bottom: 40px;
            opacity: 0; 
            transform: translateY(-20px);
            max-width: 800px;
            padding: 0 15px;
        }

        .photo-gallery.active .romantic-text {
            animation: fadeInDown 1s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes fadeInDown {
            to { opacity: 1; transform: translateY(0); }
        }

        .romantic-text h3 {
            font-family: 'Pacifico', cursive;
            font-size: clamp(2.5rem, 6vw, 4rem);
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0px var(--dark-pink), 0 5px 15px rgba(0,0,0,0.5); 
        }

        .romantic-text p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 700;
            line-height: class="1.6";
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .gallery-content {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px;
            max-width: 1200px;
            width: 100%;
            padding-bottom: 80px;
        }

        @media (min-width: 600px) { .gallery-content { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { .gallery-content { grid-template-columns: repeat(5, 1fr); gap: 25px; } }

        .gallery-item {
            width: 100%;
            height: clamp(160px, 25vw, 220px);
            object-fit: cover;
            background-color: white;
            padding: 8px 8px 35px 8px; 
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            position: relative;
        }

        .gallery-item:hover {
            transform: scale(1.15) rotate(0deg) !important;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .photo-gallery.active .gallery-item:nth-child(odd) { animation: popAndSettleLeft 1.5s ease-in-out forwards; }
        .photo-gallery.active .gallery-item:nth-child(even) { animation: popAndSettleRight 1.5s ease-in-out forwards; }

        .photo-gallery.active .gallery-item:nth-child(1) { animation-delay: 0.8s; }
        .photo-gallery.active .gallery-item:nth-child(2) { animation-delay: 1.4s; }
        .photo-gallery.active .gallery-item:nth-child(3) { animation-delay: 2.0s; }
        .photo-gallery.active .gallery-item:nth-child(4) { animation-delay: 2.6s; }
        .photo-gallery.active .gallery-item:nth-child(5) { animation-delay: 3.2s; }
        .photo-gallery.active .gallery-item:nth-child(6) { animation-delay: 3.8s; }
        .photo-gallery.active .gallery-item:nth-child(7) { animation-delay: 4.4s; }
        .photo-gallery.active .gallery-item:nth-child(8) { animation-delay: 5.0s; }
        .photo-gallery.active .gallery-item:nth-child(9) { animation-delay: 5.6s; }
        .photo-gallery.active .gallery-item:nth-child(10) { animation-delay: 6.2s; }

        @keyframes popAndSettleLeft {
            0% { opacity: 0; transform: scale(0.2) translateY(50px) rotate(-15deg); z-index: 1; }
            40% { opacity: 1; transform: scale(1.3) translateY(-10px) rotate(4deg); box-shadow: 0 30px 50px rgba(0,0,0,0.4); z-index: 50; }
            70% { opacity: 1; transform: scale(1.3) translateY(-10px) rotate(-2deg); box-shadow: 0 30px 50px rgba(0,0,0,0.4); z-index: 50; }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(-4deg); box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1; }
        }

        @keyframes popAndSettleRight {
            0% { opacity: 0; transform: scale(0.2) translateY(50px) rotate(15deg); z-index: 1; }
            40% { opacity: 1; transform: scale(1.3) translateY(-10px) rotate(-4deg); box-shadow: 0 30px 50px rgba(0,0,0,0.4); z-index: 50; }
            70% { opacity: 1; transform: scale(1.3) translateY(-10px) rotate(2deg); box-shadow: 0 30px 50px rgba(0,0,0,0.4); z-index: 50; }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(4deg); box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1; }
        }

        /* --- ANIMASI HATI MELEDAK DI TENGAH LAYAR --- */
        .explosion-container {
            /* Dibuat fixed agar selalu muncul di tengah layar HP, tidak peduli seberapa jauh di-scroll */
            position: fixed;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none; /* Agar tidak memblokir tombol lain */
        }

        .big-heart {
            position: absolute;
            font-size: clamp(6rem, 25vw, 10rem); /* Diperbesar agar sangat jelas di tengah */
            color: var(--primary-pink);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
            opacity: 0;
            transform: scale(0);
        }

        .big-heart.animate {
            animation: popBeat 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
                       explodeHeart 0.5s ease-out 2s forwards;
        }

        @keyframes popBeat {
            0% { transform: scale(0); opacity: 0; }
            40% { transform: scale(1.2); opacity: 1; }
            60% { transform: scale(1); opacity: 1; }id=""
            80% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes explodeHeart {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(4); opacity: 0; filter: blur(15px); }
        }

        .particle {
            position: absolute;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            opacity: 0;
            pointer-events: none;
            z-index: 10000;
        }

        .particle.animate {
            animation: particleFly 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes particleFly {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% {<img src="" alt=""> 
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); 
                opacity: 0; 
            }
        }

        /* Tombol Close & Musik */
        .close-gallery {
            position: fixed;
            top: 20px;
            right: clamp(20px, 4vw, 40px);
            background: rgba(201, 24, 74, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .close-gallery:hover {
            transform: scale(1.15) rotate(90deg);
            background: var(--primary-pink);
        }

        .music-btn {
            position: fixed;
            bottom: clamp(20px, 4vw, 40px);
            right: clamp(20px, 4vw, 40px);
            z-index: 100;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.6);
            color: #fff;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: var(--dark-pink);
            text-shadow: none;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="bg-fixed"></div>
    <div class="bg-overlay"></div>

    <audio id="bgMusic" loop>
        <source src="lagu-kamu.mp3" type="audio/mpeg">
    </audio>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        🎵 Play Music
    </button>

    <section class="hero">
        <div class="hearts">
            <span class="heart" style="left: 10%; font-size: 24px; animation-duration: 12s; animation-delay: 0s;"></span>
            <span class="heart" style="left: 25%; font-size: 40px; animation-duration: 18s; animation-delay: 2s;"></span>
            <span class="heart" style="left: 45%; font-size: 20px; animation-duration: 15s; animation-delay: 4s;"></span>
            <span class="heart" style="left: 65%; font-size: 35px; animation-duration: 20s; animation-delay: 1s;"></span>
            <span class="heart" style="left: 85%; font-size: 50px; animation-duration: 16s; animation-delay: 5s;"></span>
        </div>

        <div class="glass-card" id="main-card">
            <h2>Happy Birthday</h2>
            <h1>NINA</h1>
            <p class="message">
                "Semoga harimu seindah senyummu, dan semoga tahun ini membawakanmu semua kebahagiaan yang layak kamu dapatkan. Aku selalu bersyukur memilikimu."
            </p>
            <button class="signature" onclick="showGallery()">From Cengko</button>
        </div>
    </section>

    <!-- GALERI FOTO -->
    <div class="photo-gallery" id="photo-gallery">
        <button class="close-gallery" onclick="hideGallery()">×</button>
        
        <div class="romantic-text">
            <h3>Our Memories 💌</h3>
            <p>"10 potret cerita, 1000 alasan kenapa aku selalu jatuh cinta padamu setiap hari. Happy Birthday, sayang."</p>
        </div>

        <div class="gallery-content">
            <img class="gallery-item" src="foto_kita_1.jpg" alt="Foto 1">
            <img class="gallery-item" src="foto_kita_2.jpg" alt="Foto 2">
            <img class="gallery-item" src="foto_kita_3.jpg" alt="Foto 3">
            <img class="gallery-item" src="foto_kita_4.jpg" alt="Foto 4">
            <img class="gallery-item" src="foto_kita_5.jpg" alt="Foto 5">
            <img class="gallery-item" src="foto_kita_6.jpg" alt="Foto 6">
            <img class="gallery-item" src="foto_kita_7.jpg" alt="Foto 7">
            <img class="gallery-item" src="foto_kita_8.jpg" alt="Foto 8">
            <img class="gallery-item" src="foto_kita_9.jpg" alt="Foto 9">
            <img class="gallery-item" src="foto_kita_10.jpg" alt="Foto 10">
        </div>
    </div>

    <!-- TEMPAT ANIMASI HATI MELEDAK (Kini terpisah dari scroll galeri) -->
    <div class="explosion-container" id="explosion-container"></div>

    <script>
        var mySong = document.getElementById("bgMusic");
        var icon = document.getElementById("musicBtn");
        var mainCard = document.getElementById("main-card");
        var photoGallery = document.getElementById("photo-gallery");
        var explosionContainer = document.getElementById("explosion-container");
        var body = document.body;
        var explosionTimeout;

        function toggleMusic() {
            if (mySong.paused) {
                mySong.play();
                icon.innerHTML = "⏸️ Pause Music";
            } else {
                mySong.pause();
                icon.innerHTML = "🎵 Play Music";
            }
        }

        function showGallery() {
            mainCard.classList.add("hidden");
            photoGallery.classList.add("active");
            body.classList.add("gallery-open"); 
            photoGallery.scrollTop = 0; 

            // Auto-Scroll untuk HP
            var items = document.querySelectorAll('.gallery-item');
            for (var i = 0; i < items.length; i++) {
                (function(index, item) {
                    var scrollTime = 800 + (index * 600) + 500; 
                    setTimeout(function() {
                        if (window.innerWidth < 768) {
                            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, scrollTime);
                })(i, items[i]);
            }

            // Trigger Ledakan Hati setelah animasi foto selesai (sekitar 8.5 detik)
            explosionTimeout = setTimeout(createExplosion, 8500);
        }

        function hideGallery() {
            photoGallery.classList.remove("active");
            mainCard.classList.remove("hidden");
            body.classList.remove("gallery-open");
            
            clearTimeout(explosionTimeout);
            explosionContainer.innerHTML = ''; 
        }

        function createExplosion() {
            explosionContainer.innerHTML = ''; 

            // 1. Buat Hati Raksasa di tengah layar
            var bigHeart = document.createElement('div');
            bigHeart.innerHTML = '💖';
            bigHeart.className = 'big-heart animate';
            explosionContainer.appendChild(bigHeart);

            // 2. Partikel menyebar setelah hati besar berdetak (Delay 2 detik)
            setTimeout(function() {
                for(var i = 0; i < 40; i++) { // Jumlah partikel ditambah jadi 40 biar lebih meriah
                    var p = document.createElement('div');
                    var icons = ['💖', '🤍', '✨', '💕'];
                    p.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                    p.className = 'particle animate';
                    
                    // Rumus sebaran melingkar 360 derajat penuhi layar
                    var angle = Math.random() * Math.PI * 2;
                    var distance = 80 + Math.random() * 250; // Jarak sebaran diperluas
                    
                    var tx = Math.cos(angle) * distance + 'px';
                    var ty = Math.sin(angle) * distance + 'px';
                    var rot = Math.random() * 360 + 'deg';
                    
                    p.style.setProperty('--tx', tx);
                    p.style.setProperty('--ty', ty);
                    p.style.setProperty('--rot', rot);
                    
                    explosionContainer.appendChild(p);
                }
            }, 2000); 
        }
    </script>

</body>
</html>
